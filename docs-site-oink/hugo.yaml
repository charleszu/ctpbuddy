# 改编自 pgsty/oink-starter，commit 137843b25bacd76ddd1f7ce71330bf2e3155b954。
# 仅用于本地预览，不代表获得 oink.pgsty.com 或任何生产域名的授权。
title: &siteTitle CTPBuddy
baseURL: http://localhost:1313/
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
enableGitInfo: false
enableRobotsTXT: false
timeZone: UTC
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: CTPBuddy 项目、架构、开发指南与 CTP 语义资料。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]
params:
  offline_search: true
  copyright:
    authors: CTPBuddy contributors
    from_year: 2026
  footer_center_info: '兼容测试工具，非官方 CTP 产品。主题 OINK / Apache-2.0。'
  ui:
    dark_mode: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.165.0
    max: 0.165.0
