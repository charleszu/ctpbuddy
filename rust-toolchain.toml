# 开发与 CI 的工具链钉版（可复现构建）。
# 兼容性下限（MSRV）仍是 core/Cargo.toml 的 rust-version = "1.89"；
# 本文件钉定的是仓库维护者与 CI 实际使用的 stable，升级前请本地全量回归：
#   cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings
#   && cargo test --workspace
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "default"
