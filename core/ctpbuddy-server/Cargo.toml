[package]
name = "ctpbuddy-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "ctpbuddy-server"
path = "src/main.rs"

[dependencies]
ctpbuddy-wire = { path = "../ctpbuddy-wire" }
ctpbuddy-market = { path = "../ctpbuddy-market" }
ctpbuddy-matching = { path = "../ctpbuddy-matching" }
ctpbuddy-ledger = { path = "../ctpbuddy-ledger" }
serde = "1"
serde_json = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
zeromq = "0.6"

[lints]
workspace = true
