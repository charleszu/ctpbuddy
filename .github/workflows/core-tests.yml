name: Deterministic core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Python 包并验证安装入口
        run: |
          python -m pip install ./py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctpbuddy --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ctpbuddy.cli assertions check --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust 单元测试
        run: cargo test --locked --workspace --manifest-path core/Cargo.toml
      - name: Python 单元测试
        run: python tests/test_py.py

  e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [m1_smoke, m2_scenario, m2_journal]
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Python 包
        run: python -m pip install ./py
      - name: 构建本地核心（无需官方 SDK 或外部行情）
        run: cargo build --locked --bin ctpbuddy-server --manifest-path core/Cargo.toml
      - name: 运行确定性核心 e2e
        run: |
          $env:CTPBUDDY_CORE = Join-Path $env:GITHUB_WORKSPACE "core/target/debug/ctpbuddy-server.exe"
          python "tests/e2e/${{ matrix.suite }}.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
