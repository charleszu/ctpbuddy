name: Deterministic core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 套件清单的唯一事实源：windows matrix 与 linux 循环都消费这里的输出，
  # 不再在两个 job 各维护一份名单（历史上曾漂移出过三处劣化 find_core）。
  suites:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.def.outputs.windows }}
      cross: ${{ steps.def.outputs.cross }}
    steps:
      - id: def
        run: |
          # Windows-only 的套件（需要真实导出等本地数据）不进 linux 循环。
          WINDOWS_ONLY='["m4_real_replay"]'
          CROSS='["m1_smoke","m2_book","m2_flow","m2_ioc","m2_surface","m2_scenario","m2_journal","m3_detail","m3_margin","m3_refdata","m3_fee_cffex","m3_bootstrap","m3_5_settlement_info","m3_6_projection","m3_settlement","m3_order_sysid","settings","review_regressions","operations","flow_replay"]'
          python3 - "$WINDOWS_ONLY" "$CROSS" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          win_only, cross = json.loads(sys.argv[1]), json.loads(sys.argv[2])
          print("windows=%s" % json.dumps(cross + win_only))
          print("cross=%s" % json.dumps(cross))
          PY

  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装 Python 包并验证安装入口
        run: |
          python -m pip install ruff ./py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctpbuddy --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ctpbuddy.cli assertions check --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python lint（ruff：E4/E9/F，未用名/未用导入/语法错误）
        run: ruff check .
      - name: Rust 格式与 lint
        run: |
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets --manifest-path core/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust 单元测试
        run: cargo test --locked --workspace --manifest-path core/Cargo.toml
      - name: Canonical journal contract 向量与 fail-closed 校验
        run: python tests/test_journal_contract.py
      - name: Rust 核心构建（确保 server exe 存在）
        run: cargo build --locked --bin ctpbuddy-server --manifest-path core/Cargo.toml
      - name: Python 单元测试
        run: |
          python tests/test_py.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_query_expectations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_projection_upgrade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/e2e/m4_install_shim.py

  e2e:
    needs: suites
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.windows) }}
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Python 包
        run: python -m pip install ./py
      - name: 构建本地核心（无需官方 SDK 或外部行情）
        run: cargo build --locked --bin ctpbuddy-server --manifest-path core/Cargo.toml
      - name: 运行确定性核心 e2e
        run: |
          $env:CTPBUDDY_CORE = Join-Path $env:GITHUB_WORKSPACE "core/target/debug/ctpbuddy-server.exe"
          # m4_real_replay 依赖本地导出的真实行情（CI 没有）；无源时默认以退出码 3
          # 报告 SKIPPED，这里显式允许跳过，其余套件没有跳过路径。
          $extra = @()
          if ("${{ matrix.suite }}" -eq "m4_real_replay") { $extra = @("--allow-skip") }
          python "tests/e2e/${{ matrix.suite }}.py" @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # C++ Shim DLL（thosttraderapi_se / thostmduserapi_se 同名替换）+ 真实 CTP
  # 应用（demo_td.exe）经 Shim 打到 Rust 核心的端到端。
  # 依赖：MSVC（windows-latest 自带 VS 2022，shim/build_msvc.py 自动探测
  # vcvars64.bat）与 CTP 6.7.13 头文件。官方 SDK 目录 ctpsdk/ 不入库，但
  # docs/notes/assets/compiled_html/ 下已有同一版本头文件（CHM 反编译原件），
  # 通过 --sdk 指向它；Shim 只需头文件，不链接厂商 .lib。
  # 任何一步失败即作业失败，不做静默跳过。
  shim:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: false
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Python 包（e2e harness 依赖 ctpbuddy.sdk）
        run: python -m pip install ./py
      - name: 构建 Shim DLL + demo_td.exe（MSVC，头文件取自 docs/notes/assets/compiled_html）
        run: |
          python shim/build_msvc.py --demo --sdk docs/notes/assets/compiled_html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 生成源码必须与模板一致（gen_shim.py 回写后 git 无差异）
        run: |
          git diff --exit-code --ignore-cr-at-eol -- shim/src/generated shim/src/api_core.hpp core/ctpbuddy-wire/src/msgs.rs py/ctpbuddy/wire.py
          if ($LASTEXITCODE -ne 0) { Write-Error "shim/codegen/gen_shim.py 输出与仓库不一致，请重新生成并提交"; exit 1 }
      - name: Rust 核心构建
        run: cargo build --locked --bin ctpbuddy-server --manifest-path core/Cargo.toml
      - name: Shim e2e（demo_td.exe -> Shim DLL -> ctpbuddy-server）
        run: |
          $env:CTPBUDDY_CORE = Join-Path $env:GITHUB_WORKSPACE "core/target/debug/ctpbuddy-server.exe"
          python tests/e2e/m1_shim_e2e.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CTPBUDDY_SHIM_MODE = "auth-check"
          python tests/e2e/m1_shim_e2e.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows release package（fixture + 真实产物）
        env:
          CTPBUDDY_TEST_REAL_RELEASE: "1"
        run: python tests/e2e/release_package.py

  # Linux：核心单测 + Shim .so 构建 + 经 Shim 的端到端（头文件取自 docs/notes/assets/compiled_html）。
  linux:
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Python 包
        run: python -m pip install ./py
      - name: Rust 单元测试
        run: cargo test --locked --workspace --manifest-path core/Cargo.toml
      - name: 构建核心
        run: cargo build --locked --bin ctpbuddy-server --manifest-path core/Cargo.toml
      - name: 构建 Shim .so + demo_td
        run: python shim/build_linux.py --demo --sdk docs/notes/assets/compiled_html
      - name: 安装 ZMQ 验收依赖
        run: python -m pip install pyzmq
      - name: Shim 失败路径验收（失败不跳过）
        env:
          CTPBUDDY_CORE: ${{ github.workspace }}/core/target/debug/ctpbuddy-server
        run: python tests/e2e/shim_hardening.py
      - name: 核心 e2e 与 Shim e2e
        env:
          CTPBUDDY_CORE: ${{ github.workspace }}/core/target/debug/ctpbuddy-server
        run: |
          python tests/test_projection_upgrade.py
          for s in ${{ join(fromJSON(needs.suites.outputs.cross), ' ') }}; do
            python tests/e2e/$s.py
          done
          python tests/e2e/m1_shim_e2e.py
          CTPBUDDY_SHIM_MODE=auth-check python tests/e2e/m1_shim_e2e.py

  # Rust 依赖漏洞公告审计（纯 Rust 依赖，Cargo.lock 在 core/ 下）。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --file core/Cargo.lock

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux Docker acceptance
        run: python3 tools/docker_acceptance.py
